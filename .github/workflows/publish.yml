name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - name: Verify tag matches package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('mamkit/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag != version $version"; exit 1; }
      - run: twine check --strict dist/*
      - name: Verify built wheel
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install "torch>=2.3.0,<2.4" "torchaudio>=2.3.0,<2.4" --index-url https://download.pytorch.org/whl/cpu
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "import mamkit; print(mamkit.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mamkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # A tag that is re-pushed -- moved onto the merge commit it should
          # have been on, most likely -- re-runs this workflow against a
          # version PyPI already holds. Without this the upload is rejected
          # and the run goes red for having nothing to do, which is a failure
          # that means the opposite of one.
          skip-existing: true

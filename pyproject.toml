[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamkit"
dynamic = ["version"]
description = "A Comprehensive Multimodal Argument Mining Toolkit."
readme = "README.md"
authors = [
    { name = "Eleonora Mancini", email = "e.mancini@unibo.it" },
    { name = "Federico Ruggeri", email = "federico.ruggeri6@unibo.it" },
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torchtext 0.18 publishes wheels up to CPython 3.12 and binds torch 2.3.
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "librosa>=0.9.1",
    "lightning>=2.5.1",
    "nltk>=3.9.1",
    "numpy>=1.26.4,<2",
    "pandas>=2.2.2",
    "pydub>=0.25.1",
    "resampy>=0.4.3",
    "scikit-image>=0.19.2",
    "simplejson>=3.20.1",
    "torch>=2.3.0,<2.4",
    "torchaudio>=2.3.0,<2.4",
    "torchmetrics>=1.4.1",
    "torchtext==0.18.0",
    "tqdm>=4.66.5",
    "transformers~=4.48.0",
    "yt_dlp>=2025.2.19",
]

[project.urls]
Homepage = "https://github.com/nlp-unibo/mamkit"
Documentation = "https://nlp-unibo.github.io/mamkit/"
Source = "https://github.com/nlp-unibo/mamkit"
Issues = "https://github.com/nlp-unibo/mamkit/issues"

[project.optional-dependencies]
dev = [
    "nox>=2024.3.2",
    "pytest>=7.0.0",
    "ruff>=0.15.20",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "pydata-sphinx-theme>=0.15",
]

[tool.setuptools.packages.find]
include = ["mamkit*"]

[tool.setuptools.dynamic]
version = { attr = "mamkit.__version__" }

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.md", "docsrc"]
line-length = 88
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# ponytail: long docstrings and data tables in modules the Cinnamon refactoring
# replaces; delete each entry when its module is rewritten.
"demos/*" = ["E501"]
"mamkit/data/collators.py" = ["E501"]
"mamkit/data/datasets.py" = ["E501"]
"mamkit/data/processing.py" = ["E501"]
"mamkit/models/text_audio.py" = ["E501"]

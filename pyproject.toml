[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamkit"
dynamic = ["version"]
description = "A Comprehensive Multimodal Argument Mining Toolkit."
readme = "README.md"
authors = [
    { name = "Eleonora Mancini", email = "e.mancini@unibo.it" },
    { name = "Federico Ruggeri", email = "federico.ruggeri6@unibo.it" },
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "librosa>=0.10.0",
    "lightning>=2.5.1",
    "nltk>=3.9.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pydub>=0.25.1",
    # pydub imports audioop, which Python 3.13 removed from the standard library.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "cinnamon-core>=2.3.0,<3",
    "scikit-image>=0.19.2",
    "simplejson>=3.20.1",
    "soundfile>=0.12.1",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "torchmetrics>=1.4.1",
    "tqdm>=4.66.5",
    "transformers~=4.48.0",
    "yt_dlp>=2025.2.19",
]

[project.urls]
Homepage = "https://github.com/nlp-unibo/mamkit"
Documentation = "https://nlp-unibo.github.io/mamkit/"
Source = "https://github.com/nlp-unibo/mamkit"
Issues = "https://github.com/nlp-unibo/mamkit/issues"

[project.optional-dependencies]
dev = [
    "nox>=2024.3.2",
    "pytest>=7.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.20",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "pydata-sphinx-theme>=0.15",
]

[tool.setuptools.packages.find]
include = ["mamkit*"]

[tool.setuptools.dynamic]
version = { attr = "mamkit.__version__" }

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.md", "docsrc"]
line-length = 88
lint.select = ["E", "F", "I", "W"]

[tool.coverage.run]
branch = true
source = ["mamkit"]

[tool.coverage.report]
# Measured at 98.76% on Python 3.10 on 2026-11-03. The registration modules
# run fully on import, so they raise the figure. CI and nox both read this.
fail_under = 98
